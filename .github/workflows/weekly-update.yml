name: Weekly BD Report Update

on:
  schedule:
    # Target: report live by Tuesday 09:00 Manila. GitHub queues scheduled
    # runs ~4-6h late on this repo (Sep-Oct 2026 runs landed 13:40-15:30
    # for a 09:00 slot), so the EARLY slot fires at 03:00 Manila to land by ~09:00.
    # Every run overwrites the current Wed-Tue week, so later slots just
    # refresh the numbers with Tuesday-morning activity.
    # EARLY: Tuesday 03:00 Manila (Mon 19:00 UTC) — still Tuesday in Manila,
    # so it resolves to the correct week.
    - cron: '0 19 * * 1'
    # PRIMARY: Tuesday 09:00 Manila (01:00 UTC).
    - cron: '0 1 * * 2'
    # BACKUP: Tuesday 12:00 Manila (04:00 UTC).
    - cron: '0 4 * * 2'
  # Manual trigger — click "Run workflow" in GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

# Delayed runs can pile up; run them one at a time so pushes don't collide.
concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run weekly report updater
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python update_weekly_report.py

      - name: Commit & push updated HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bd-weekly-report.html
          git diff --staged --quiet || git commit -m "chore: weekly report update $(date -u +'%Y-%m-%d')"
          git push
